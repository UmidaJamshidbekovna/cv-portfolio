# Bu faylni profil reposingizga shu manzilga joylang:
#   UmidaJamshidbekovna/UmidaJamshidbekovna/.github/workflows/snake.yml
#
# U har 12 soatda (va har push'da) contribution grafikingizdan
# snake.svg yasab, "output" branch'ga joylaydi. README undan o'qiydi.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # har 12 soatda
  push:
    branches:
      - main
  workflow_dispatch:          # qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: UmidaJamshidbekovna
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=EEE0A3&color_dots=1c1917,3f2d1a,8a6d2f,c9a84a,EEE0A3

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
